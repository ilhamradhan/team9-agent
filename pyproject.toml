[project]
name = "team9-agent"
version = "0.1.0"
description = "Small LangGraph HR document Q&A prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
team9-agent = "hr_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
